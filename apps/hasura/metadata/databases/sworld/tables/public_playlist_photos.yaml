table:
  name: playlist_photos
  schema: public
configuration:
  column_config:
    created_at:
      custom_name: createdAt
    updated_at:
      custom_name: updatedAt
  custom_column_names:
    created_at: createdAt
    updated_at: updatedAt
  custom_root_fields: {}
object_relationships:
  - name: playlist
    using:
      foreign_key_constraint_on: playlist_id
  - name: photo
    using:
      foreign_key_constraint_on: photo_id
select_permissions:
  - role: user
    permission:
      columns:
        - position
      filter:
        _and:
          - playlist:
              user_id:
                _eq: X-Hasura-User-Id
          - photo:
              user_id:
                _eq: X-Hasura-User-Id
      allow_aggregations: true
      query_root_fields: []
      subscription_root_fields: []
    comment: Relationship-only; a user sees join rows only for playlists and photos they own
